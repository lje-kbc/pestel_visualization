[project]
name = "pestel-visualization"
version = "0.1.0"
description = "Interactive, self-contained world maps for PESTEL country scores"
readme = "README.md"
authors = [
    { name = "lje-kbc", email = "l.jendraszewski@kbc-consultants.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pestel-map = "pestel_visualization.cli:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
